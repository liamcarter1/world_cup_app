name: Keep scores fresh

# Pings the app's public live-sync endpoint so scores/results update server-side even
# when nobody has the app open. The endpoint is throttled + only fetches ESPN when a
# match is live, so off-match pings are cheap no-ops. Public repo => free Actions minutes.
on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch: {} # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live sync
        run: |
          curl -fsS --max-time 70 "https://world-cup-app-khaki.vercel.app/api/live" || true
